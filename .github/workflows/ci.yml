name: Documentation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel any in-progress run for the same branch on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Action versions are pinned to semver tags.
# For production hardening, replace tags with full commit SHAs.
# See: https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions

jobs:

  markdown-lint:
    name: Lint Markdown
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # clearpath-latex/ is a submodule and is intentionally not fetched;
      # its README.md is excluded from linting.
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            README.md
            docs/**/*.md

  shellcheck:
    name: Lint Shell Scripts
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts
          severity: warning

  validate-configs:
    name: Validate Config Files
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML files
        run: |
          python3 -c "
          import yaml, sys
          files = [
              'config/robot.yaml.example',
              '.github/workflows/ci.yml',
              '.github/workflows/external-links.yml',
          ]
          for path in files:
              with open(path) as f:
                  yaml.safe_load(f)
              print(f'{path}: valid YAML')
          "

      - name: Validate JSON files
        run: |
          python3 -m json.tool .markdownlint.json > /dev/null
          echo '.markdownlint.json: valid JSON'

  spell-check:
    name: Spell Check
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run codespell
        uses: codespell-project/actions-codespell@v2
        with:
          skip: '.git,*.pdf,*.svg,*.png,*.zip,gen,clearpath-latex'
          ignore_words_file: .codespellignore

  link-check-internal:
    name: Check Internal Links
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check internal links (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --offline
            --include-fragments
            --no-progress
            README.md
            docs/**/*.md
          fail: true
